# Render blueprint: one web service with the inline scheduler, plus Postgres.
# Set PAYPAL_* and one model key (ANTHROPIC_API_KEY or GEMINI_API_KEY) in the Render
# dashboard (sync: false). Leave the other key blank.
# APP_URL is not set here: the app reads the address Render gives the service
# (RENDER_EXTERNAL_URL), so a different service name cannot break buyer links.
# Set APP_URL yourself only when you attach a custom domain.
services:
  - type: web
    name: proofhold
    runtime: node
    plan: free
    region: oregon
    # TypeScript and the type packages are devDependencies and the build needs them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PROOFHOLD_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: proofhold-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: PROOFHOLD_SCHEDULER
        value: inline
      - key: DEMO_SILENCE_MINUTES
        value: "2"

databases:
  - name: proofhold-db
    plan: free
    region: oregon
