# Render blueprint: one web service with the inline scheduler, plus Postgres.
# Set PAYPAL_* and ANTHROPIC_API_KEY in the Render dashboard (sync: false).
services:
  - type: web
    name: proofhold
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PROOFHOLD_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: proofhold-db
          property: connectionString
      - key: APP_URL
        value: https://proofhold.onrender.com
      - key: APP_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: PROOFHOLD_SCHEDULER
        value: inline
      - key: DEMO_SILENCE_MINUTES
        value: "2"

databases:
  - name: proofhold-db
    plan: free
    region: oregon
